name = "hex-modular"
defaultTargets = ["HexModular"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexArith"
git = "https://github.com/leanprover/hex-arith.git"
rev = "v0.8.0"

[[lean_lib]]
name = "HexModular"

[[lean_lib]]
name = "HexModularTests"
globs = ["HexModular.KernelTests", "HexModular.LoopTests"]
